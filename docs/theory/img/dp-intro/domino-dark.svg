<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img"><title>Индукция как домино: база падает сама, каждая следующая падает от предыдущих</title><defs><marker id="ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#fb923c"/></marker></defs><rect x="70.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#14392a" stroke="#4ade80" stroke-width="1.8" transform="rotate(62.0 92.0 222.0)"/><text x="81.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(0)</text><rect x="136.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#14392a" stroke="#4ade80" stroke-width="1.8" transform="rotate(62.0 158.0 222.0)"/><text x="147.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(1)</text><rect x="202.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#14392a" stroke="#4ade80" stroke-width="1.8" transform="rotate(62.0 224.0 222.0)"/><text x="213.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(2)</text><rect x="268.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#4a3512" stroke="#fbbf24" stroke-width="1.8" transform="rotate(30.0 290.0 222.0)"/><text x="279.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(3)</text><rect x="334.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#272b4a" stroke="#6366f1" stroke-width="1.8" transform="rotate(0.0 356.0 222.0)"/><text x="345.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(4)</text><rect x="400.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#272b4a" stroke="#6366f1" stroke-width="1.8" transform="rotate(0.0 422.0 222.0)"/><text x="411.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(5)</text><rect x="466.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#272b4a" stroke="#6366f1" stroke-width="1.8" transform="rotate(0.0 488.0 222.0)"/><text x="477.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">f(6)</text><rect x="532.0" y="130.0" width="22.0" height="92.0" rx="4" fill="#272b4a" stroke="#6366f1" stroke-width="1.8" transform="rotate(0.0 554.0 222.0)"/><text x="543.0" y="242.0" font-size="14" fill="#9ca3af" font-weight="600" text-anchor="middle" dominant-baseline="central">…</text><line x1="40.0" y1="222.0" x2="610.0" y2="222.0" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M64,70 L64,62 L198,62 L198,70" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="131.0" y="40.0" font-size="14" fill="#4ade80" font-weight="700" text-anchor="middle" dominant-baseline="central">база: проверили руками</text><text x="399.0" y="40.0" font-size="14" fill="#fb923c" font-weight="700" text-anchor="middle" dominant-baseline="central">переход: упали все предыдущие —</text><text x="399.0" y="60.0" font-size="14" fill="#fb923c" font-weight="700" text-anchor="middle" dominant-baseline="central">значит, падает и эта</text><path d="M319,74 Q287,84 287,122" fill="none" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent2)"/><text x="320.0" y="268.0" font-size="14" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">f(0) и f(1) верны  ⇒  f(2) верно  ⇒  f(3) верно  ⇒  …  ⇒  верно для всех n</text></svg>
