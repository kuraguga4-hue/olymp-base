.5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="310.0" font-size="15" fill="#1f2937" font-weight="600" text-anchor="middle" dominant-baseline="central">dp[4] = dp[3] + dp[2] + dp[1] = 4 + 2 + 1 = 7</text></svg>
