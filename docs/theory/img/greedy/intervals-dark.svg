<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" role="img" aria-label="Два неверных жадных правила для заявок"><title>Два неверных жадных правила для заявок</title><style>:root{--ob-bg-2:#0f131b;--ob-bg-3:#151b26;--ob-text:#c4ccd8;--ob-muted:#8a94a7;--ob-line-2:#283142;--ob-accent:#2fd8c4;--ob-verdict-ac:#5cb85c;--ob-verdict-wa:#f0ad4e}text{font-family:Inter,Arial,sans-serif;fill:var(--ob-text)}.mono{font-family:'JetBrains Mono',monospace}.muted{fill:var(--ob-muted)}</style><rect x="10" y="10" width="620" height="180" rx="12" fill="var(--ob-bg-2)" stroke="var(--ob-line-2)"/><text x="28" y="39" font-size="17" text-anchor="start" class="" font-weight="700">Раньше начинается</text><text x="28" y="64" font-size="12" text-anchor="start" class="muted" font-weight="400">Длинная заявка мешает двум</text><text x="28" y="115" font-size="15" text-anchor="start" class="" font-weight="700">1 выбор</text><text x="28" y="138" font-size="14" text-anchor="start" class="muted" font-weight="400">вместо 2</text><rect x="240" y="75" width="324" height="25" rx="6" fill="var(--ob-bg-3)" stroke="var(--ob-verdict-wa)" stroke-width="2.5"/><text x="402" y="92" font-size="11" text-anchor="middle" class="mono" font-weight="600">1–10</text><circle cx="240" cy="87.5" r="3" fill="var(--ob-verdict-wa)"/><circle cx="564" cy="87.5" r="3" fill="var(--ob-verdict-wa)"/><rect x="276" y="109" width="36" height="25" rx="6" fill="var(--ob-bg-3)" stroke="var(--ob-verdict-ac)" stroke-width="2.5"/><text x="294" y="126" font-size="11" text-anchor="middle" class="mono" font-weight="600">2–3</text><circle cx="276" cy="121.5" r="3" fill="var(--ob-verdict-ac)"/><circle cx="312" cy="121.5" r="3" fill="var(--ob-verdict-ac)"/><rect x="348" y="143" width="36" height="25" rx="6" fill="var(--ob-bg-3)" stroke="var(--ob-verdict-ac)" stroke-width="2.5"/><text x="366" y="160" font-size="11" text-anchor="middle" class="mono" font-weight="600">4–5</text><circle cx="348" cy="155.5" r="3" fill="var(--ob-verdict-ac)