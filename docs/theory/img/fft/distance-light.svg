" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="16.0" y="152.0" font-size="13" text-anchor="start" dominant-baseline="central"><tspan fill="#596476" font-weight="700">b</tspan></text><text x="121.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">0</tspan></text><rect x="96.0" y="130.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="121.0" y="152.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="177.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">1</tspan></text><rect x="152.0" y="130.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="177.0" y="152.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="233.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">2</tspan></text><rect x="208.0" y="130.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.6"/><text x="233.0" y="152.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="700">0</tspan></text><text x="289.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">3</tspan></text><rect x="264.0" y="130.0" width="50.0" height="44.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="289.0" y="152.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="16.0" y="166.0" font-size="10" text-anchor="start" dominant-baseline="central"><tspan fill="#596476" font-weight="400">развёрнут</tspan></text><line x1="121.0" y1="84.0" x2="278.8" y2="126.3" stroke="#087f73" stroke-width="1.8" stroke-linecap="round"/><polygon points="285.0,128.0 276.1,130.2 278.4,121.7" fill="#087f73"/><text x="16.0" y="106.0" font-size="12" text-anchor="start" dominant-baseline="central"><tspan fill="#087f73" font-weight="700">j ↦ n − 1 − j</tspan></text><text x="330.0" y="52.0" font-size="13" text-anchor="start" dominant-baseline="central"><tspan fill="#ff8c00" font-weight="700">r = 2</tspan><tspan fill="#0d121b" font-weight="600">,  </tspan><tspan fill="#087f73" font-weight="700">j = 0 ↦ 3</tspan><tspan fill="#0d121b" font-weight="600">,  d = r − j = 2</tspan></text><text x="330.0" y="76.0" font-size="12" text-anchor="start" dominant-baseline="central"><tspan fill="#596476" font-weight="400">индекс в свёртке:</tspan></text><text x="330.0" y="98.0" font-size="13" text-anchor="start" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">r + (n − 1 − j) = 2 + 3 = </tspan><tspan fill="#ff8c00" font-weight="700">5</tspan></text><text x="330.0" y="120.0" font-size="13" text-anchor="start" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">= (n − 1) + d = 3 + 2</tspan></text><text x="16.0" y="252.0" font-size="13" text-anchor="start" dominant-baseline="central"><tspan fill="#596476" font-weight="700">c = a * b</tspan></text><text x="121.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">0</tspan></text><rect x="96.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="121.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="177.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">1</tspan></text><rect x="152.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="177.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="233.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">2</tspan></text><rect x="208.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="233.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="289.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">3</tspan></text><rect x="264.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.6"/><text x="289.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="700">3</tspan></text><text x="345.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">4</tspan></text><rect x="320.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#e4f3e9" stroke="#1e9e45" stroke-width="1.6"/><text x="345.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="401.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">5</tspan></text><rect x="376.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#fff1e0" stroke="#ff8c00" stroke-width="1.6"/><text x="401.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="457.0" y="218.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">6</tspan></text><rect x="432.0" y="230.0" width="50.0" height="44.0" rx="6" fill="#e4f3e9" stroke="#1e9e45" stroke-width="1.6"/><text x="457.0" y="252.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">1</tspan></text><text x="314.0" y="290.0" font-size="11" text-anchor="end" dominant-baseline="central"><tspan fill="#596476" font-weight="400">n − 1: позиции с собой</tspan></text><line x1="320.0" y1="282.0" x2="466.0" y2="282.0" stroke="#1e9e45" stroke-width="1.6" stroke-linecap="round"/><text x="560.0" y="252.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#1e9e45" font-weight="700">ответы</tspan></text><text x="560.0" y="270.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#1e9e45" font-weight="700">d = 1, 2, 3</tspan></text></svg>
