inant-baseline="central"><tspan fill="#e8edf5" font-weight="700">1</tspan></text><circle cx="400.0" cy="140.0" r="6.5" fill="#ffa133" stroke="#ffa133" stroke-width="1"/><text x="384.0" y="140.0" font-size="15" text-anchor="end" dominant-baseline="central"><tspan fill="#e8edf5" font-weight="700">−1</tspan></text><line x1="290.0" y1="116.0" x2="353.6" y2="116.0" stroke="#5e687b" stroke-width="1.6" stroke-linecap="round"/><polygon points="360.0,116.0 352.0,120.4 352.0,111.6" fill="#5e687b"/><text x="325.0" y="100.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a94a7" font-weight="700">z ↦ z²</tspan></text><text x="325.0" y="168.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#2fd8c4" font-weight="700">1² = (−1)² = 1</tspan></text><text x="325.0" y="190.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#ffa133" font-weight="700">i² = (−i)² = −1</tspan></text><text x="160.0" y="266.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a94a7" font-weight="600">4 точки: корни 4-й степени</tspan></text><text x="480.0" y="266.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a94a7" font-weight="600">2 точки: корни 2-й степени</tspan></text></svg>
