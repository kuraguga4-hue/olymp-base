<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" font-family="Inter, system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Два массива коэффициентов проходят через FFT, значения перемножаются по одинаковым точкам, обратное FFT возвращает коэффициенты ответа</title><rect x="16.0" y="30.0" width="160.0" height="46.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="96.0" y="53.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">коэффициенты A</tspan></text><rect x="16.0" y="100.0" width="160.0" height="46.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="96.0" y="123.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">коэффициенты B</tspan></text><rect x="236.0" y="30.0" width="160.0" height="46.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="316.0" y="53.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">значения A(ωᵏ)</tspan></text><rect x="236.0" y="100.0" width="160.0" height="46.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="316.0" y="123.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">значения B(ωᵏ)</tspan></text><line x1="176.0" y1="53.0" x2="227.6" y2="53.0" stroke="#087f73" stroke-width="1.6" stroke-linecap="round"/><polygon points="234.0,53.0 226.0,57.4 226.0,48.6" fill="#087f73"/><text x="206.0" y="41.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#087f73" font-weight="700">FFT</tspan></text><text x="206.0" y="66.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">N log N</tspan></text><line x1="176.0" y1="123.0" x2="227.6" y2="123.0" stroke="#087f73" stroke-width="1.6" stroke-linecap="round"/><polygon points="234.0,123.0 226.0,127.4 226.0,118.6" fill="#087f73"/><text x="206.0" y="111.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#087f73" font-weight="700">FFT</tspan></text><text x="206.0" y="136.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">N log N</tspan></text><rect x="446.0" y="58.0" width="180.0" height="62.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="536.0" y="78.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">значения C(ωᵏ)</tspan></text><text x="536.0" y="99.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">= A(ωᵏ) · B(ωᵏ)</tspan></text><line x1="396.0" y1="53.0" x2="438.4" y2="76.9" stroke="#8a93a5" stroke-width="1.6" stroke-linecap="round"/><polygon points="444.0,80.0 434.9,79.9 439.2,72.2" fill="#8a93a5"/><line x1="396.0" y1="123.0" x2="438.3" y2="101.9" stroke="#8a93a5" stroke-width="1.6" stroke-linecap="round"/><polygon points="444.0,99.0 438.8,106.5 434.9,98.6" fill="#8a93a5"/><text x="536.0" y="138.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">× в каждой точке: N умножений</tspan></text><rect x="16.0" y="196.0" width="160.0" height="46.0" rx="6" fill="#e4f3e9" stroke="#1e9e45" stroke-width="1.6"/><text x="96.0" y="219.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">коэффициенты C</tspan></text><polyline points="536.0,150.0 536.0,219.0 184.4,219.0" fill="none" stroke="#087f73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polygon points="178.0,219.0 186.0,214.6 186.0,223.4" fill="#087f73"/><text x="357.0" y="206.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#087f73" font-weight="700">обратное FFT</tspan></text><text x="357.0" y="232.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">N log N</tspan></text><line x1="96.0" y1="146.0" x2="96.0" y2="187.6" stroke="#8a93a5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 5"/><polygon points="96.0,194.0 91.6,186.0 100.4,186.0" fill="#8a93a5"/><text x="110.0" y="171.0" font-size="11" text-anchor="start" dominant-baseline="central"><tspan fill="#596476" font-weight="400">в лоб: n · m умножений</tspan></text></svg>
