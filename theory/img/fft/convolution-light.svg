<svg xmlns="http://www.w3.org/2000/svg" width="640" height="186" viewBox="0 0 640 186" font-family="Inter, system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>В умножении каждый элемент первого массива сочетается с каждым элементом второго; произведения собираются по сумме индексов</title><text x="210.0" y="22.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">все произведения aⱼ · bₖ</tspan></text><text x="514.0" y="22.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">свёртка: складываем по j + k</tspan></text><text x="163.0" y="50.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">b₀ = 3</tspan></text><text x="257.0" y="50.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">b₁ = 4</tspan></text><text x="66.0" y="92.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">a₀ = 1</tspan></text><text x="66.0" y="152.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">a₁ = 2</tspan></text><rect x="120.0" y="66.0" width="86.0" height="52.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="163.0" y="84.0" font-size="14" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">1 · 3 = 3</tspan></text><text x="163.0" y="103.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">в c₀</tspan></text><rect x="214.0" y="66.0" width="86.0" height="52.0" rx="6" fill="#fff1e0" stroke="#ff8c00" stroke-width="1.6"/><text x="257.0" y="84.0" font-size="14" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">1 · 4 = 4</tspan></text><text x="257.0" y="103.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">в c₁</tspan></text><rect x="120.0" y="126.0" width="86.0" height="52.0" rx="6" fill="#fff1e0" stroke="#ff8c00" stroke-width="1.6"/><text x="163.0" y="144.0" font-size="14" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">2 · 3 = 6</tspan></text><text x="163.0" y="163.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">в c₁</tspan></text><rect x="214.0" y="126.0" width="86.0" height="52.0" rx="6" fill="#e4f3e9" stroke="#1e9e45" stroke-width="1.6"/><text x="257.0" y="144.0" font-size="14" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="600">2 · 4 = 8</tspan></text><text x="257.0" y="163.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">в c₂</tspan></text><line x1="312.0" y1="122.0" x2="397.6" y2="122.0" stroke="#8a93a5" stroke-width="1.6" stroke-linecap="round"/><polygon points="404.0,122.0 396.0,126.4 396.0,117.6" fill="#8a93a5"/><text x="358.0" y="108.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">j + k</tspan></text><text x="448.0" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">c₀</tspan></text><rect x="420.0" y="96.0" width="56.0" height="52.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="448.0" y="122.0" font-size="18" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">3</tspan></text><text x="448.0" y="166.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">3</tspan></text><text x="514.0" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">c₁</tspan></text><rect x="486.0" y="96.0" width="56.0" height="52.0" rx="6" fill="#fff1e0" stroke="#ff8c00" stroke-width="1.6"/><text x="514.0" y="122.0" font-size="18" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">10</tspan></text><text x="514.0" y="166.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">4 + 6</tspan></text><text x="580.0" y="82.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">c₂</tspan></text><rect x="552.0" y="96.0" width="56.0" height="52.0" rx="6" fill="#e4f3e9" stroke="#1e9e45" stroke-width="1.6"/><text x="580.0" y="122.0" font-size="18" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">8</tspan></text><text x="580.0" y="166.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">8</tspan></text></svg>
