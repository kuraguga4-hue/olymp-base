<svg xmlns="http://www.w3.org/2000/svg" width="640" height="214" viewBox="0 0 640 214" font-family="Inter, system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>Склейка для точки i: из u равно 1 и v равно 2 получаем значения 1 плюс 2i и 1 минус 2i</title><text x="84.0" y="22.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">u₁ = E(−1)</tspan></text><text x="84.0" y="132.0" font-size="12" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="600">v₁ = O(−1)</tspan></text><rect x="24.0" y="34.0" width="120.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="84.0" y="56.0" font-size="15" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">u₁ = 1</tspan></text><rect x="24.0" y="144.0" width="120.0" height="44.0" rx="6" fill="#f2f5f9" stroke="#d2d9e4" stroke-width="1.2"/><text x="84.0" y="166.0" font-size="15" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">v₁ = 2</tspan></text><line x1="144.0" y1="166.0" x2="182.6" y2="166.0" stroke="#8a93a5" stroke-width="1.6" stroke-linecap="round"/><polygon points="189.0,166.0 181.0,170.4 181.0,161.6" fill="#8a93a5"/><circle cx="215.0" cy="166.0" r="25.0" fill="#fff1e0" stroke="#ff8c00" stroke-width="1.6"/><text x="215.0" y="166.0" font-size="14" text-anchor="middle" dominant-baseline="central"><tspan fill="#ff8c00" font-weight="700">× i</tspan></text><line x1="240.0" y1="166.0" x2="300.0" y2="166.0" stroke="#ff8c00" stroke-width="1.8" stroke-linecap="round"/><text x="270.0" y="150.0" font-size="13" text-anchor="middle" dominant-baseline="central"><tspan fill="#ff8c00" font-weight="700">t = 2i</tspan></text><line x1="144.0" y1="56.0" x2="300.0" y2="56.0" stroke="#8a93a5" stroke-width="1.8" stroke-linecap="round"/><circle cx="300.0" cy="56.0" r="4.0" fill="#8a93a5" stroke="#8a93a5" stroke-width="1"/><circle cx="300.0" cy="166.0" r="4.0" fill="#ff8c00" stroke="#ff8c00" stroke-width="1"/><line x1="300.0" y1="56.0" x2="421.6" y2="56.0" stroke="#8a93a5" stroke-width="1.8" stroke-linecap="round"/><polygon points="428.0,56.0 420.0,60.4 420.0,51.6" fill="#8a93a5"/><line x1="300.0" y1="56.0" x2="423.0" y2="152.1" stroke="#8a93a5" stroke-width="1.8" stroke-linecap="round"/><polygon points="428.0,156.0 419.0,154.5 424.4,147.6" fill="#8a93a5"/><line x1="300.0" y1="166.0" x2="422.9" y2="73.8" stroke="#ff8c00" stroke-width="1.8" stroke-linecap="round"/><polygon points="428.0,70.0 424.2,78.3 419.0,71.3" fill="#ff8c00"/><line x1="300.0" y1="166.0" x2="421.6" y2="166.0" stroke="#ff8c00" stroke-width="1.8" stroke-linecap="round"/><polygon points="428.0,166.0 420.0,170.4 420.0,161.6" fill="#ff8c00"/><text x="408.0" y="82.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#ff8c00" font-weight="700">+</tspan></text><text x="408.0" y="152.0" font-size="16" text-anchor="middle" dominant-baseline="central"><tspan fill="#ff8c00" font-weight="700">−</tspan></text><rect x="430.0" y="34.0" width="186.0" height="44.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="523.0" y="56.0" font-size="15" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">y₁ = 1 + 2i</tspan></text><rect x="430.0" y="144.0" width="186.0" height="44.0" rx="6" fill="#087f73" fill-opacity="0.16" stroke="#087f73" stroke-width="1.6"/><text x="523.0" y="166.0" font-size="15" text-anchor="middle" dominant-baseline="central"><tspan fill="#0d121b" font-weight="700">y₃ = 1 − 2i</tspan></text><text x="523.0" y="92.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">u + t, точка i</tspan></text><text x="523.0" y="202.0" font-size="11" text-anchor="middle" dominant-baseline="central"><tspan fill="#596476" font-weight="400">u − t, точка −i</tspan></text></svg>
