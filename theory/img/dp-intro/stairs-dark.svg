<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390" font-family="Inter, system-ui, 'Segoe UI', Roboto, Arial, sans-serif" role="img"><title>На ступеньку 4 приходят со ступеньки 3 шагом на 1 или со ступеньки 2 шагом на 2</title><defs><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2fd8c4"/></marker><marker id="ah-accent2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#ffa133"/></marker></defs><rect x="70.0" y="299.0" width="100.0" height="46.0" rx="6" fill="#151b26" stroke="#283142" stroke-width="1.5"/><text x="120.0" y="322.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(0) = 1</text><text x="120.0" y="365.0" font-size="13" fill="#8a94a7" font-weight="400" text-anchor="middle" dominant-baseline="central">пол</text><rect x="170.0" y="253.0" width="100.0" height="92.0" rx="6" fill="#151b26" stroke="#283142" stroke-width="1.5"/><text x="220.0" y="276.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(1) = 1</text><text x="220.0" y="365.0" font-size="13" fill="#8a94a7" font-weight="400" text-anchor="middle" dominant-baseline="central">ступенька 1</text><rect x="270.0" y="207.0" width="100.0" height="138.0" rx="6" fill="#112a1f" stroke="#3ddc6b" stroke-width="1.5"/><text x="320.0" y="230.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(2) = 2</text><text x="320.0" y="365.0" font-size="13" fill="#8a94a7" font-weight="400" text-anchor="middle" dominant-baseline="central">ступенька 2</text><rect x="370.0" y="161.0" width="100.0" height="184.0" rx="6" fill="#112a1f" stroke="#3ddc6b" stroke-width="1.5"/><text x="420.0" y="184.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(3) = 3</text><text x="420.0" y="365.0" font-size="13" fill="#8a94a7" font-weight="400" text-anchor="middle" dominant-baseline="central">ступенька 3</text><rect x="470.0" y="115.0" width="100.0" height="230.0" rx="6" fill="#2e2417" stroke="#ffa133" stroke-width="1.5"/><text x="520.0" y="138.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(4) = 5</text><text x="520.0" y="365.0" font-size="13" fill="#8a94a7" font-weight="400" text-anchor="middle" dominant-baseline="central">ступенька 4</text><path d="M428,155 Q460,91 502,107" fill="none" stroke="#ffa133" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent2)"/><text x="426.0" y="115.0" font-size="17" fill="#ffa133" font-weight="700" text-anchor="middle" dominant-baseline="central">+1</text><path d="M320,201 Q410,-50 538,107" fill="none" stroke="#2fd8c4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/><text x="390.0" y="23.0" font-size="17" fill="#2fd8c4" font-weight="700" text-anchor="middle" dominant-baseline="central">+2</text><rect x="66.6" y="31.6" width="296.8" height="28.8" rx="14.4" fill="#2e2417" stroke="#ffa133" stroke-width="1.5"/><text x="215.0" y="46.0" font-size="16" fill="#e8edf5" font-weight="600" text-anchor="middle" dominant-baseline="central">f(4) = f(3) + f(2) = 3 + 2 = 5</text></svg>
