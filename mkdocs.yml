site_name: Олимпиадная база
site_description: Открытая база теории и практики для подготовки к олимпиадам по программированию
repo_url: https://github.com/kuraguga4-hue/olymp-base
repo_name: olymp-base

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # шрифты Inter и JetBrains Mono подключает stylesheets/extra.css
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  # дизайн «Judge Night»: по умолчанию тёмная тема, цвета — в stylesheets/extra.css
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Тёмная тема

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - js/progress.js
  - js/generator.js

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Внутренние файлы команды — не публикуем на сайте
exclude_docs: |
  STYLE.md
  CONTEXT.md

# Ровно три раздела. Главная (index.md) — обложка, на неё ведёт логотип;
# журнал ошибок ИИ (INCIDENTS.md) открывается по ссылке с главной.
