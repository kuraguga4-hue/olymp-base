site_name: Олимпиадная база
site_description: Открытая база теории и практики для подготовки к олимпиадам по программированию
repo_url: https://github.com/kuraguga4-hue/olymp-base
repo_name: olymp-base

theme:
  name: material
  language: ru
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Светлая тема

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Внутренние файлы команды — не публикуем на сайте
exclude_docs: |
  STYLE.md
  CONTEXT.md

nav:
  - Главная: index.md
  - Теория:
      - theory/index.md
      - "Префиксные суммы": theory/prefix-sums.md
      - "Бинарный поиск и поиск по ответу": theory/binary-search.md
      - "Два указателя": theory/two-pointers.md
      - "Жадные алгоритмы": theory/greedy.md
      - "Динамическое программирование: начало": theory/dp-intro.md
      - "Графы: BFS и DFS": theory/bfs-dfs.md
      - "Теория чисел": theory/number-theory.md
      - "DSU": theory/dsu.md
  - Практика:
      - practice/index.md
      - "Префиксные суммы": practice/prefix-sums.md
      - "Бинарный поиск и поиск по ответу": practice/binary-search.md
      - "Два указателя": practice/two-pointers.md
      - "Жадные алгоритмы": practice/greedy.md
      - "Динамическое программирование: начало": practice/dp-intro.md
      - "Графы: BFS и DFS": practice/bfs-dfs.md
      - "Теория чисел": practice/number-theory.md
      - "DSU": practice/dsu.md
  - Мой прогресс: me.md
  - Журнал ошибок ИИ: INCIDENTS.md
