site_name: Олимпиадная база
site_description: Открытая база теории и практики для подготовки к олимпиадам по программированию
repo_url: https://github.com/kuraguga4-hue/olymp-base
repo_name: olymp-base

theme:
  name: material
  language: ru
  logo: assets/logo.svg
  favicon: assets/logo.svg
  # шрифты Inter и JetBrains Mono подключает stylesheets/extra.css
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  # дизайн «Judge Night»: по умолчанию тёмная тема, цвета — в stylesheets/extra.css
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Тёмная тема

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - js/progress.js
  - js/generator.js
  - js/mentor.js

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Внутренние файлы команды — не публикуем на сайте
exclude_docs: |
  STYLE.md
  CONTEXT.md

# Ровно три раздела. Главная (index.md) — обложка, на неё ведёт логотип;
# журнал ошибок ИИ (INCIDENTS.md) открывается по ссылке с главной.
nav:
  - Теория:
      - theory/index.md
      - "Сложные идеи простым языком":
          - "Корневая декомпозиция": theory/sqrt-decomposition.md
          - "Дерево отрезков": theory/segment-tree.md
          - "Декартово дерево": theory/treap.md
          - "FFT и свёртки": theory/fft.md
      - "Основные приёмы":
          - "Сортировки": theory/sorting.md
          - "Бинарный поиск и поиск по ответу": theory/binary-search.md
          - "Префиксные суммы": theory/prefix-sums.md
          - "Два указателя": theory/two-pointers.md
          - "Жадные алгоритмы и как их доказывать": theory/greedy.md
          - "Динамическое программирование: начало": theory/dp-intro.md
      - "Графы, строки и числа":
          - "Обход в глубину (DFS)": theory/dfs.md
          - "Кратчайшие пути": theory/shortest-paths.md
          - "Система непересекающихся множеств (DSU)": theory/dsu.md
          - "Строки и хеширование": theory/strings.md
          - "Теория чисел: НОД, решето, быстрое возведение в степень": theory/number-theory.md
  - Практика:
      - practice/index.md
      - Архив олимпиад:
          - practice/olympiads/index.md
          - "ВсОШ · заключительный этап": practice/olympiads/vsosh-final/index.md
          - "ВсОШ · региональный этап": practice/olympiads/vsosh-region/index.md
          - "Открытая олимпиада": practice/olympiads/open-olympiad/index.md
          - "Высшая проба": practice/olympiads/vysshaya-proba/index.md
          - "Innopolis Open": practice/olympiads/innopolis-open/index.md
          - "Vorg CUP": practice/olympiads/vorgcup/index.md
      - "Сложные идеи простым языком":
          - "Корневая декомпозиция": practice/sqrt-decomposition.md
          - "Дерево отрезков": practice/segment-tree.md
          - "Декартово дерево": practice/treap.md
          - "FFT и свёртки": practice/fft.md
      - "Основные приёмы":
          - "Сортировки": practice/sorting.md
          - "Бинарный поиск и поиск по ответу": practice/binary-search.md
          - "Префиксные суммы": practice/prefix-sums.md
          - "Два указателя": practice/two-pointers.md
          - "Жадные алгоритмы и как их доказывать": practice/greedy.md
          - "Динамическое программирование: начало": practice/dp-intro.md
      - "Графы, строки и числа":
          - "Обход в глубину (DFS)": practice/dfs.md
          - "Кратчайшие пути": practice/shortest-paths.md
          - "Система непересекающихся множеств (DSU)": practice/dsu.md
          - "Строки и хеширование": practice/strings.md
          - "Теория чисел: НОД, решето, быстрое возведение в степень": practice/number-theory.md
  - Статистика: me.md
